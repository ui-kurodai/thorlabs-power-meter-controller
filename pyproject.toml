[project]
name = "thorlabs-power-meter-controller"
version = "0.1.0"
description = "Small Python controller for Thorlabs TLPM-compatible optical power meters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shoichi Ui" }
]
dependencies = [
    "pythonnet>=3.0.5; sys_platform == 'win32'",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/ui-kurodai/thorlabs_power_meter_controller"
Source = "https://github.com/ui-kurodai/thorlabs_power_meter_controller"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thorlabs_power_meter_controller"]
